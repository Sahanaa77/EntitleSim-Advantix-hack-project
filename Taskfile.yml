version: '3'

tasks:
  dev:
    desc: Run backend (uvicorn :8000) and frontend (vite :5173) together
    deps:
      - dev-backend
      - dev-frontend

  dev-backend:
    desc: Run FastAPI backend on :8000
    dir: backend
    cmds:
      - python -m uvicorn entitlesim.main:app --host 0.0.0.0 --port 8000 --reload

  dev-frontend:
    desc: Run Vite frontend on :5173
    dir: frontend
    cmds:
      - npm run dev -- --host 0.0.0.0 --port 5173

  up:
    desc: Start all services via docker-compose (optional)
    cmds:
      - docker compose up --build

  down:
    desc: Stop all services (optional)
    cmds:
      - docker compose down

  test:
    desc: Run backend test suite
    dir: backend
    cmds:
      - pytest -q tests

  seed:
    desc: Seed sample model into database
    dir: backend
    cmds:
      - python -m entitlesim.samples.seed
