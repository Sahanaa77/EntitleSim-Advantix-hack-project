services:
  db:
    image: postgres:16-alpine
    container_name: entitlesim-db
    restart: always
    environment:
      POSTGRES_USER: entitlesim
      POSTGRES_PASSWORD: entitlesim_secret
      POSTGRES_DB: entitlesim
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entitlesim -d entitlesim"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: entitlesim-api
    restart: always
    environment:
      DATABASE_URL: postgresql://entitlesim:entitlesim_secret@db:5432/entitlesim
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: entitlesim-web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
